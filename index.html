<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanjut99</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <!-- Tombol Kembali Pojok Kiri Atas -->
    <div class="p-4">
        <a href="https://LINK_TUJUAN_KEMBALI_DISINI.com" target="_blank" class="inline-flex items-center gap-1 text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded-lg transition">
          ← Back
        </a>
    </div>

    <!-- Foto Profil & Nama di Tengah Atas -->
    <div class="flex flex-col items-center mt-4 mb-8">
        <img src="https://i.postimg.cc/fW0ZVm7r/Screenshot-20260603-154806.jpg" alt="Foto Profil" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md">
        <h2 class="text-2xl font-bold text-gray-900 mt-3">Milan's</h2>
        <p class="text-gray-600">Shaders Editor</p>
    </div>

    <!-- Kolom Pencarian & Tombol Halaman -->
    <div class="px-6 mb-6 flex flex-col md:flex-row gap-3">
        <div class="w-full md:flex-1">
            <input type="text" id="cari" placeholder="nyari disini ygy" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="flex gap-2">
        </div>
    </div>

    <!-- Daftar Shaders - Susun 2 Kolom -->
    <div class="px-6">
        <div id="daftar-shaders" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- Contoh Item Shaders 1 -->
            <div class="bg-white rounded-lg shadow p-4 border border-gray-200 hover:shadow-md transition">
                <div class="flex items-center gap-3 mb-3">
                    <i class="fa fa-file-code-o text-2xl text-purple-600"></i>
                    <div>
                        <h3 class="font-semibold text-gray-900">BSL - Pink Cardigan</h3>
                        <p class="text-sm text-gray-500">Versi 1.0</p>
                    </div>
                </div>
                <a href="https://LINK_DOWNLOAD_SHADERS_1_DISINI.com" target="_blank" class="w-full block text-center bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg transition">
                    Donlot
                </a>
            </div>
          
          <div class="bg-white rounded-lg shadow p-4 border border-gray-200 hover:shadow-md transition">
                <div class="flex items-center gap-3 mb-3">
                    <i class="fa fa-file-code-o text-2xl text-purple-600"></i>
                    <div>
                        <h3 class="font-semibold text-gray-900">Derivative - Seus Cheap</h3>
                        <p class="text-sm text-gray-500">Versi 1.0</p>
                    </div>
                </div>
                <a href="https://LINK_DOWNLOAD_SHADERS_1_DISINI.com" target="_blank" class="w-full block text-center bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg transition">
                    Donlot

                </a>
            </div>

        </div>
    </div>

    <!-- Script Fungsi Pencarian Sederhana -->
    <script>
        const inputCari = document.getElementById('cari');
        const daftarShaders = document.getElementById('daftar-shaders').children;

        inputCari.addEventListener('input', function() {
            const kataKunci = this.value.toLowerCase();
            for (let item of daftarShaders) {
                const judul = item.querySelector('h3').textContent.toLowerCase();
                if (judul.includes(kataKunci)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            }
        });
    </script>

</body>
</html>
